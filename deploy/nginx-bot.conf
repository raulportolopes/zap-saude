# Site do Zap-Saúde no Nginx que já roda na VPS.
# Copie para /etc/nginx/sites-available/bot.magox.tech, ative e rode o certbot (ver DEPLOY.md).
server {
    listen 80;
    listen [::]:80;
    server_name bot.magox.tech;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
