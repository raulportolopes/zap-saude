services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # só a própria VPS acessa; o Nginx (ou o Caddy) publica com HTTPS
    volumes:
      - modelos:/cache   # modelo de transcrição baixado na primeira mensagem de áudio

  # Só para VPS sem Nginx nas portas 80/443:  docker compose --profile caddy up -d
  caddy:
    image: caddy:2.8
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
    depends_on:
      - bot

volumes:
  modelos:
  caddy_dados:
